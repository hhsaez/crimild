name: CMake source style

on: [push, pull_request]

permissions:
  contents: read

jobs:
  cmake-source-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CMake source checker
        run: python3 -m unittest discover -s scripts/tests
      - name: Check explicit source scopes
        run: python3 scripts/check_cmake_sources.py
